<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Película · CINEASTRA</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="assets/styles.css">

<body>
  <nav class="navbar navbar--solid">
    <div class="navbar__inner">
      <a class="logo navbar__brand" href="index.html"><span class="logo__mark"><span></span><span></span><span></span></span><span class="logo__text">CINE<span>ASTRA</span></span></a>
      <div class="navbar__links">
        <a class="nav-link" href="index.html">Inicio</a>
        <a class="nav-link is-active" href="cartelera.html">Cartelera</a>
        <a class="nav-link" href="proximos.html">Próximos estrenos</a>

      </div>
      <div class="navbar__user" id="navbar-user"></div>
    </div>
  </nav>
  <main class="page movie-detail" data-pelicula>
    <section class="movie-hero" style="position:relative;min-height:420px;padding-top:120px;background:linear-gradient(90deg,rgba(6,6,9,.97),rgba(6,6,9,.72)),#08080b;">
      <div class="container movie-hero__inner">
        <div data-config-warning></div>
        <div style="display:grid;grid-template-columns:minmax(180px,260px) 1fr;gap:32px;align-items:end;margin-top:12px;">
          <div><div data-poster-box style="width:100%;aspect-ratio:2/3;border-radius:16px;background:#16161e;display:grid;place-items:center;color:#6f6f7f;box-shadow:var(--shadow);">Sin póster</div></div>
          <div>
            <span class="eyebrow">Película</span>
            <h1 data-title style="font-family:var(--font-display);font-size:clamp(2.4rem,6vw,4.6rem);line-height:.95;margin:6px 0 10px;">Cargando…</h1>
            <p data-meta style="color:var(--muted);margin-bottom:12px;"></p>
            <p data-synopsis style="max-width:760px;color:#d6d6de;">Sin sinopsis (campo no incluido en tu esquema).</p>
            <div style="margin-top:18px;display:flex;gap:10px;flex-wrap:wrap;"><a class="btn btn--primary" href="#funciones">Comprar entradas</a><a class="btn btn--ghost" href="cartelera.html">Volver</a></div>
          </div>
        </div>
      </div>
    </section>
    <section class="section movie-detail__body" id="funciones">
      <div class="container">
        <div class="section-heading section-heading--compact"><div><span class="eyebrow">Elegí tu momento</span><h2>Funciones disponibles</h2><p>Seleccioná un horario para elegir tus asientos.</p></div></div>
        <div class="function-list" data-funciones></div>
      </div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/config.js"></script>
  <script src="assets/app.js"></script>

</html>
