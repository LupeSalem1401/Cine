<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión · CINEASTRA</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <nav class="navbar navbar--solid">
    <div class="navbar__inner">
      <a class="logo navbar__brand" href="index.html"><span class="logo__mark"><span></span><span></span><span></span></span><span class="logo__text">CINE<span>ASTRA</span></span></a>
      <div class="navbar__links">
        <a class="nav-link" href="index.html">Inicio</a>
        <a class="nav-link" href="cartelera.html">Cartelera</a>
        <a class="nav-link" href="proximos.html">Próximos estrenos</a>
      </div>
    </div>
  </nav>

  <main class="site-main">
    <section class="section" style="min-height: 70vh; display: flex; align-items: center; justify-content: center;">
      <div class="container" style="max-width: 420px;">
        <div class="card" style="padding: 32px;">
          <div style="text-align: center; margin-bottom: 24px;">
            <span class="eyebrow">CINEASTRA</span>
            <h1 style="margin: 8px 0 4px;">Iniciar sesión</h1>
            <p style="color: var(--muted);">Accede a tu cuenta para comprar entradas</p>
          </div>

          <div data-config-warning></div>

          <form id="login-form" novalidate>
            <div class="form-group" style="margin-bottom: 16px;">
              <label class="form-label" for="nombre">Nombre</label>
              <input class="form-input" type="text" id="nombre" name="nombre" placeholder="Tu nombre" required autocomplete="name">
            </div>

            <div class="form-group" style="margin-bottom: 16px;">
              <label class="form-label" for="edad">Edad</label>
              <input class="form-input" type="number" id="edad" name="edad" placeholder="Tu edad" required min="1" max="120" autocomplete="off">
            </div>

            <div class="form-group" style="margin-bottom: 16px;">
              <label class="form-label" for="email">Email</label>
              <input class="form-input" type="email" id="email" name="email" placeholder="tu@email.com" required autocomplete="email">
            </div>

            <div id="login-error" class="empty-state" style="display: none; margin-bottom: 16px; text-align: left;">
              <h3>Error</h3>
              <p id="error-message"></p>
            </div>

            <button class="btn btn--primary btn--lg" type="submit" style="width: 100%;" id="login-btn">Ingresar</button>
          </form>

          <div style="margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--line); text-align: center; color: var(--muted); font-size: 14px;">
            <p>Usuarios de prueba:</p>
            <p style="font-family: monospace; font-size: 12px; margin: 4px 0;">salemlupe91@gmail.com (Usuario)</p>
            <p style="font-family: monospace; font-size: 12px; margin: 4px 0;">2511130208@undc.edu.pe (Admin)</p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container" style="padding:36px 0;color:var(--muted);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-top:1px solid var(--line);">
      <span>© 2026 CINEASTRA</span>
      <span>HTML + CSS + JS + Supabase</span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/config.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
